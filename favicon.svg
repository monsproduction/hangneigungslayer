<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Dasselbe Uhrensymbol wie in der Navigation der Seiten. Als eigenstaendige
       Datei mit fest eingesetzten Farben statt CSS-Variablen, weil ein Favicon
       ausserhalb des Seitenkontexts geladen wird. Hintergrund gefuellt, damit
       das Symbol auch auf dunklen Browser-Tableisten steht. -->
  <rect width="24" height="24" rx="4" fill="#E9E0CD"/>
  <g fill="none" stroke="#2B2721" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.1 4.7V1.5h5.8v3.2"/>
    <path d="M9.1 19.3v3.2h5.8v-3.2"/>
    <circle cx="12" cy="12" r="7.4"/>
  </g>
  <g fill="#2B2721">
    <rect x="3.2" y="8.3" width="2.3" height="1.5" rx=".5"/>
    <rect x="3.2" y="11.25" width="2.3" height="1.5" rx=".5"/>
    <rect x="3.2" y="14.2" width="2.3" height="1.5" rx=".5"/>
    <rect x="18.5" y="9.5" width="2.3" height="1.5" rx=".5"/>
    <rect x="18.5" y="13" width="2.3" height="1.5" rx=".5"/>
  </g>
  <circle cx="12" cy="12" r="5.8" fill="#A34724"/>
  <g fill="none" stroke="#FBF6EC" stroke-width=".85">
    <ellipse cx="11.6" cy="13.1" rx="3.6" ry="2.3"/>
    <ellipse cx="12.4" cy="12" rx="1.6" ry="1.05"/>
  </g>
</svg>
